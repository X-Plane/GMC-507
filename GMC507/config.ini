; GMC507 settings: "key = value", ; or # starts a comment. Unknown keys are
; written to Log.txt and ignored; an invalid value falls back to the default.

ap_type = digital          ; digital | analog: FALLBACK only. It decides laminar/gfc500/installed (digital = 1, analog = 0)
                           ; when no AFCS v2 provider is present. When a provider publishes laminar/afcs/cap_digital
                           ; (port_version >= 2), cap_digital wins; on a mismatch with this key ONE warning goes to
                           ; Log.txt. 0 lets the G5 offer GPSS with its own ap_option=gpss
min_engage_kias = 0        ; >0: AP and LVL keys are ignored below this airspeed while the AP is off (0 = no gate)
popup_at_start = 0         ; 1 = show the 2D popup when the script loads
disc_flash_s = 3           ; seconds the AP lamp flashes amber after a manual disconnect (AFMS/MM 3 s; G5 manual 5 s)
alt_sel_step_ft = 100      ; ALT SEL knob step, written once into sim/aircraft/autopilot/alt_step_ft (restored at unload)
vs_wheel_fpm = 100         ; VS wheel step, written once into sim/aircraft/autopilot/vvi_step_ft (restored at unload)
knob_anim_deg = 15         ; knob / wheel animation per detent, in degrees (the datarefs hold revolutions: deg / 360)
log_keys = 0               ; 1 = write every key press and every X-Plane command it sends to Log.txt (field testing)
pick_mode = 1              ; 3D clicks (gmc507_pick.lua): 0 off, 1 auto (yields to native clicks), 2 always
pick_pass_misses = 0       ; 1 = a click between the controls passes to the host (keep 0)
pick_debug = 0             ; 1 = log every pick and a self-test (field testing)
