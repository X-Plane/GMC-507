; AFCS_ESP: per-aircraft settings. See SPEC.md for the port.
; Unknown keys are logged in Log.txt and ignored.

; 1 = ESP installed, 0 = the port still exists but ESP is never available
esp = 1
; the pilot's ESP switch when the aircraft loads: 1 on, 0 off
esp_enabled_at_start = 1
; 1 = AGL height data available; 0 = none (ESP arms on the ground, no
; low-airspeed protection)
esp_agl = 1
; degrees: roll 45..60, pitch up 10..25, pitch down 5..25
esp_roll_limit = 45
esp_pitch_up = 20
esp_pitch_down = 20
; knots. esp_speed_max 0 = the aircraft's VNE. esp_speed_min 0 = the aircraft's
; VS1 x esp_speed_min_margin (see below); a value above 0 is used as it is
esp_speed_max = 0
esp_speed_min = 0
; low-speed protection starts at VS1 x this, when esp_speed_min = 0 (1..2).
; Garmin's guide only says "the minimum configured airspeed", so 1.1 is this
; package's own rule (C172: starts at 52.8 kt, about the stall warning, so a
; normal approach is not pushed). The nose-down push is at full strength at 90 %
; of the start speed (0.99 x VS1 by default). VS1 is the flaps-up stall speed at
; 1 g, wings level; in a bank the stall speed is higher, so full push is NOT
; guaranteed to be above the stall. 1 = start at VS1 itself (the old behaviour)
esp_speed_min_margin = 1.1

; where "attitude valid" comes from:
;   heartbeat = a display writes laminar/afcs/attitude_heartbeat (default)
;   sim       = valid unless the sim's AHRS (rel_g_arthorz) has failed
attitude_source = heartbeat

; how the forces reach the controls:
;   artstab = this package writes X-Plane's art-stab input (default)
;   none    = nothing; the aircraft reads laminar/afcs/esp_*_force itself
actuator = artstab
; full ESP push as a share of full control deflection
actuator_roll_authority = 0.30
actuator_pitch_authority = 0.20
; most the output may change per second (ratio units), 0.05..5; 0 would engage
; ESP but never push, so a value below 0.05 is logged and replaced by 0.05
actuator_slew_per_s = 0.6

; Describing the aircraft's autopilot (port v2: laminar/afcs/cap_digital,
; cap_ias_mode, ap_pft). These keys are OFF by default: a key that is not set
; is not published, and displays then use their own setting for that field.
; Set a key only when you know the answer for this aircraft, and describe the
; aircraft's autopilot, never this package. Remove the leading ";" to declare.
;
; 1 = a digital autopilot that shares data with the displays; 0 = it does not
;cap_digital = 1
; 1 = the autopilot has an IAS (FLC) mode that uses the display's airspeed
; reference; 0 = no IAS mode
;cap_ias_mode = 1
; seconds of preflight test after autopilot power-up, 0..60; 0 = no test
;pft_s = 5
